<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2a1b2e">
<title>Carte privilège</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--a:#d9a3b5;--b1:#2a1b2e;--b2:#6b3f5e;--bg:#f6eff0;--ln:#e6d6da}
*{box-sizing:border-box}
body{margin:0;font:15px Jost,system-ui,sans-serif;background:var(--bg);color:#2a1b2e;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{max-width:380px;margin:28px auto;border-radius:22px;padding:24px;color:#fff;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 18px 40px #0004;position:relative;overflow:hidden}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#fff3 50%,transparent 60%);transform:translateX(-100%);animation:sh 1.6s .3s 1 forwards}
@keyframes sh{to{transform:translateX(100%)}}@media(prefers-reduced-motion:reduce){.card:after{animation:none}}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.dots i{aspect-ratio:1;border-radius:50%;border:1.5px solid #fff5;display:grid;place-items:center;font-style:normal;color:transparent;font-size:16px}
.dots i.on{background:var(--a);border-color:var(--a);color:var(--b1)}
.rw{background:#fff2;border-radius:12px;padding:10px 12px;margin:10px 0}
.qr{background:#fff;padding:10px;border-radius:12px;width:max-content;margin:14px auto 8px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
button,input,select,textarea{font:inherit;border-radius:10px;border:1px solid var(--ln);padding:10px 12px;background:#fff;color:inherit}
button{cursor:pointer}button.p{background:var(--b1);color:#fff;border-color:var(--b1)}button.on{background:var(--a);border-color:var(--a)}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.box{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input{flex:1;min-width:120px}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.f{display:grid;gap:4px;margin-bottom:10px}.f label{font-size:13px;opacity:.7}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:6px 4px;border-bottom:1px solid var(--ln)}
textarea{width:100%}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:18px}.hd img{width:46px;height:46px;border-radius:12px;object-fit:cover}.hd.tp{flex-direction:column;text-align:center}.hd.tp img{width:64px;height:64px}
.ft{max-width:380px;margin:0 auto 12px;text-align:center;font-size:14px;padding:0 12px}.ft a{color:inherit}.lk{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.lk a{border:1px solid var(--ln);border-radius:20px;padding:6px 12px;text-decoration:none;background:#fff}
.ft details p{white-space:pre-line;text-align:left;background:#fff;border-radius:12px;padding:10px}.ft summary{cursor:pointer}
.stg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}.stg .box{margin:0}
.bars{display:flex;gap:4px;align-items:flex-end;height:120px;margin-top:10px}.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.bars span{width:100%;background:var(--a);border-radius:4px 4px 0 0;min-height:2px}.bars small{font-size:10px}
#sh{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}.shb{background:#fff;border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:480px}.shb li{margin:8px 0}
#msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a1b2e;color:#fff;padding:10px 16px;border-radius:12px;display:none}
</style></head><body>
<div id="app"></div><div id="msg" role="status"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzd3vdAAnlGCk0s5-9kVnMyoIV7evWFKAPA_bzfoH9hYnnVgA-_bPfqW97iTNMOkcofvQ/exec'; // URL du déploiement Web App (…/exec)
const $=s=>document.querySelector(s),app=$('#app');
let G,PIN=sessionStorage.pin||'',scn;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?new Date(d).toLocaleDateString('fr-FR'):'';
const toast=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2600)};
async function call(o){const r=await fetch(API,{method:'POST',body:JSON.stringify({pin:PIN,...o})});const j=await r.json();if(j.error)throw j.error;if(j.g)theme(j.g);return j}
function theme(g){G=g;const s=document.documentElement.style;s.setProperty('--a',g.accent);s.setProperty('--b1',g.bg1);s.setProperty('--b2',g.bg2);brand(g)}
function cardHTML(c,g){let s='';for(let i=0;i<g.need;i++)s+=`<i class="${i<c.stamps?'on':''}">${esc(g.icon)}</i>`;
return `<div class="card"><div class="hd ${g.logoPos=='top'?'tp':''}">${g.logo?`<img src="${esc(g.logo)}" alt="">`:''}<div><div class="serif" style="font-size:28px">${esc(g.shop)}</div><div style="opacity:.7">${esc(g.cardTitle)}</div></div></div><div class="dots">${s}</div>
<p>${Math.min(c.stamps,g.need)} / ${g.need}</p>${c.reward?`<div class="rw">🎁 ${esc(g.reward)}<br><small>Valable jusqu'au ${fd(c.exp)}</small></div>`:''}
<div class="qr" id="qr"></div><div style="text-align:center;opacity:.85">${esc(c.name)} · ${c.id}</div></div>`}
const QR='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',H5='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js',LB={};
const lib=u=>LB[u]||(LB[u]=new Promise((ok,ko)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=ko;document.head.appendChild(s)}));
async function qr(id){await lib(QR);const el=$('#qr');if(!el)return;el.innerHTML='';new QRCode(el,{text:id,width:118,height:118,colorDark:'#2a1b2e',colorLight:'#fff'})}

/* ---------- Vue client ---------- */
async function showCard(id){
  let last='';
  const paint=j=>{last=JSON.stringify(j);theme(j.g);app.innerHTML=cardHTML(j.c,j.g)+footHTML(j.g)+insHTML();qr(j.c.id);insBind()};
  try{paint(JSON.parse(localStorage['cd_'+id]))}catch(e){app.innerHTML='<div class="wrap"><p style="text-align:center;opacity:.6">Chargement…</p></div>'}
  const draw=async()=>{try{const j=await call({a:'card',id});try{localStorage['cd_'+id]=JSON.stringify(j)}catch(e){}if(JSON.stringify(j)!=last)paint(j)}
    catch(e){if(!app.querySelector('.card'))app.innerHTML=`<div class="wrap"><p>${esc(e)}</p></div>`}};
  draw();setInterval(()=>{if(!document.hidden)draw()},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});
}

/* ---------- Dashboard ---------- */
async function admin(){
  if(!PIN)return login();
  let L;try{L=await call({a:'login'})}catch(e){PIN='';sessionStorage.pin='';return login(e)}
  app.innerHTML=`<div class="wrap"><h1 class="serif" style="margin:4px 0 12px">${esc(G.shop)}</h1>
  <nav>${[['scan','Scanner'],['cl','Clients'],['st','Stats'],['hi','Historique'],['cf','Réglages']].map(([k,t])=>`<button data-t="${k}">${t}</button>`).join('')}</nav>${L.ver>=3?'':'<div class="box" style="border-color:#c33">⚠️ Le backend (Code.gs) n\'est pas à jour : Déployer → Gérer les déploiements → ✏️ → Version : Nouvelle version → Déployer.</div>'}<div id="tab"></div></div>`;
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));tab('scan');
}
function login(err){
  app.innerHTML=`<div class="wrap" style="max-width:360px;margin-top:20vh"><h1 class="serif">Espace boutique</h1>
  <div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="Code PIN"><button class="p" id="go">Entrer</button></div>${err?`<p>${esc(err)}</p>`:''}</div>`;
  $('#go').onclick=()=>{PIN=$('#pin').value;sessionStorage.pin=PIN;admin()};
}
async function tab(k){
  if(scn){scn.stop().catch(()=>{});scn=null}
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==k));
  try{await ({scan:tScan,cl:tCl,st:tSt,hi:tHi,cf:tCf})[k]()}catch(e){$('#tab').innerHTML='<div class="box">⚠️ '+esc(e)+'</div>'}
}
async function tScan(){
  $('#tab').innerHTML=`<div class="box"><div id="rd"></div><div class="row" style="margin-top:8px"><input id="mid" placeholder="ou saisir le code (ex: A1B2C3)"><button id="fnd">Chercher</button></div></div><div id="res"></div>`;
  $('#fnd').onclick=()=>found($('#mid').value.trim());
  await lib(H5);if(!$('#rd'))return;
  scn=new Html5Qrcode('rd');scn.start({facingMode:'environment'},{fps:10,qrbox:200},t=>{scn.stop().catch(()=>{});scn=null;found(t)}).catch(()=>{$('#rd').textContent='Caméra indisponible : saisissez le code.'});
}
async function found(id,c){
  try{if(!c)c=(await call({a:'card',id})).c;
    $('#res').innerHTML=`<div class="box"><b class="serif" style="font-size:22px">${esc(c.name)}</b> <small>${c.id}</small><br><small>${esc(c.tel||'')}${c.since?' · client depuis le '+fd(c.since):''}</small>
    <p>${c.stamps} / ${G.need} tampons ${c.reward?'· 🎁 récompense disponible (jusqu\'au '+fd(c.exp)+')':''}</p>
    <div class="row"><input id="qty" type="number" min="1" value="1" style="max-width:80px"><button class="p" id="st">Ajouter tampon(s)</button>${c.reward?'<button id="rd2">Valider la récompense</button>':''}</div></div>`;
    const act=async a=>{try{const j=await call({a,id:c.id,n:$('#qty').value});toast(j.msg);found(c.id,j.c);if($('#bk'))hist(c.id)}catch(e){toast(e)}};
    $('#st').onclick=()=>act('stamp');if(c.reward)$('#rd2').onclick=()=>act('redeem');
    if($('#bk')){$('#res').insertAdjacentHTML('beforeend',`<div class="box row"><input id="en" value="${esc(c.name)}"><input id="et" value="${esc(c.tel)}"><button id="es">Modifier</button><button id="ed">Supprimer</button></div>`);
      $('#es').onclick=async()=>{try{await call({a:'edit',id:c.id,name:$('#en').value.trim(),tel:$('#et').value.trim()});toast('Client modifié');tClient(c.id)}catch(e){toast(e)}};
      $('#ed').onclick=async()=>{if(confirm('Supprimer ce client et sa carte ?')){try{await call({a:'del',id:c.id});toast('Client supprimé');tCl()}catch(e){toast(e)}}}}
  }catch(e){toast(e)}
}
async function tCl(){
  $('#tab').innerHTML=`<div class="box"><div class="row"><input id="nm" placeholder="Nom"><input id="tl" placeholder="Téléphone" inputmode="tel"><button class="p" id="ad">Créer la carte</button></div><button id="ex" style="margin-top:8px">Exporter les clients (CSV)</button></div>
  <input id="q" placeholder="Rechercher…" style="width:100%;margin-bottom:10px"><div class="box" id="ls">Chargement…</div>`;
  const {list}=await call({a:'list'});
  const draw=()=>{const q=$('#q').value.toLowerCase();
    $('#ls').innerHTML=list.filter(c=>(c.name+c.tel+c.id).toLowerCase().includes(q)).map(c=>`<div class="li"><div><b><a href="#" data-d="${c.id}" style="color:inherit">${esc(c.name)}</a></b><br><small>${c.id} · ${c.stamps}/${G.need}${c.reward?' · 🎁':''}</small></div>
    <div class="row"><button data-l="${c.id}">Lien</button><button data-w="${c.id}">WhatsApp</button></div></div>`).join('')||'Aucun client.';
    document.querySelectorAll('[data-d]').forEach(b=>b.onclick=e=>{e.preventDefault();tClient(b.dataset.d)});
    document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(link(b.dataset.l));toast('Lien copié')});
    document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const c=list.find(x=>x.id==b.dataset.w);let t=String(c.tel).replace(/\D/g,'');if(t.length==8)t='216'+t;
      open(`https://wa.me/${t}?text=${encodeURIComponent('Bonjour '+c.name+', voici votre carte '+G.cardTitle+' : '+link(c.id))}`)})};
  $('#q').oninput=draw;draw();
  $('#ex').onclick=()=>csv('clients.csv',[['id','nom','tel','tampons','recompense','depuis','dernier passage'],...list.map(c=>[c.id,c.name,c.tel,c.stamps,c.reward?'oui':'non',fd(c.since),fd(c.last)])]);
  $('#ad').onclick=async()=>{const name=$('#nm').value.trim();if(!name)return toast('Nom requis');await call({a:'add',name,tel:$('#tl').value});toast('Carte créée');tCl()};
}
const link=id=>location.origin+location.pathname+'?c='+id;
const hT=(h,n)=>h.length?`<table>${h.map(r=>`<tr><td>${new Date(r.d).toLocaleString('fr-FR')}</td>${n?`<td>${esc(r.n)}</td>`:''}<td>${esc(r.a)}</td><td>${esc(r.t)}</td></tr>`).join('')}</table>`:'Aucun mouvement.';
async function tHi(id=''){
  $('#tab').innerHTML=`<div class="box row"><select id="hc"><option value="">Tous les clients</option></select><select id="ha"><option value="">Toutes les actions</option><option>tampon</option><option>récompense</option><option>création</option><option>modification</option></select><button id="hx">Exporter CSV</button></div><div class="box" id="hh">Chargement…</div>`;
  const [{list},{h}]=await Promise.all([call({a:'list'}),call({a:'hist',id})]);
  $('#hc').innerHTML+=list.map(c=>`<option value="${c.id}">${esc(c.name)} (${c.id})</option>`).join('');$('#hc').value=id;
  let cur=h;const draw=()=>{const a=$('#ha').value;cur=h.filter(r=>!a||String(r.a).includes(a));$('#hh').innerHTML=hT(cur,!id)};
  $('#hx').onclick=()=>csv('historique.csv',[['date','id','client','action','détail'],...cur.map(r=>[new Date(r.d).toLocaleString('fr-FR'),r.id,r.n,r.a,r.t])]);
  $('#hc').onchange=e=>tHi(e.target.value);$('#ha').onchange=draw;draw();
}
function tClient(id){
  $('#tab').innerHTML=`<button id="bk">← Clients</button><div id="res" style="margin-top:10px"></div><div class="box" id="hh">Chargement…</div>`;
  $('#bk').onclick=tCl;found(id);hist(id);
}
async function hist(id){try{const {h}=await call({a:'hist',id});$('#hh').innerHTML='<b class="serif" style="font-size:20px">Historique</b>'+hT(h,false)}catch(e){$('#hh').innerHTML='⚠️ '+esc(e)}}
const THEMES=[['Prune rosé','#d9a3b5','#2a1b2e','#6b3f5e'],['Nuit & or','#d4af6a','#14161f','#2b2f45'],['Bordeaux','#e8b4a0','#3b0f1c','#7a2335'],['Émeraude','#bfe3cf','#0f2a24','#25594c'],['Bleu nuit','#a9c4f5','#0e1b3d','#2f4a8a'],['Blush','#7a3b4e','#f3d6d9','#d99aa8']];
const FT=[['link','Linktree (lien)'],['fb','Facebook (lien ou nom)'],['ig','Instagram (@nom ou lien)'],['tel','Téléphone'],['addr','Adresse'],['rules','Règlement']];
let lg='';
function tCf(){
  lg=G.logo||'';const ft=G.foot||{};
  const F=[['shop','Nom de la boutique'],['cardTitle','Titre de la carte'],['need','Tampons pour une récompense','number'],['reward','Récompense'],['validDays','Validité de la récompense (jours)','number'],
  ['mode','Après utilisation','select'],['icon','Icône du tampon'],['accent','Couleur d\'accent','color'],['bg1','Fond de carte (début)','color'],['bg2','Fond de carte (fin)','color'],['pin','Nouveau PIN (vide = inchangé)','password']];
  $('#tab').innerHTML=`<div class="box"><b>Thèmes prêts</b><div class="row" style="margin:8px 0 14px">${THEMES.map((t,i)=>`<button data-th="${i}" style="background:linear-gradient(135deg,${t[2]},${t[3]});color:${t[1]};border:0">${t[0]}</button>`).join('')}</div>
  ${F.map(([k,l,t])=>`<div class="f"><label>${l}</label>${t=='select'?`<select id="c_${k}"><option value="carry">Garder l'excédent de tampons</option><option value="zero">Remettre à zéro</option></select>`:`<input id="c_${k}" type="${t||'text'}" value="${k=='pin'?'':esc(G[k])}">`}</div>`).join('')}</div>
  <div class="box"><b>Logo</b><div class="row" style="margin:8px 0"><input id="lgf" type="file" accept="image/*"><button id="lgx">Retirer</button></div><div id="lgp"></div>
  <div class="f"><label>Position sur la carte</label><select id="c_logoPos"><option value="left">À côté du nom</option><option value="top">Au-dessus, centré</option></select></div></div>
  <div class="box"><b>Pied de page de la carte</b><p><small>Cochez ce qui doit s'afficher chez le client.</small></p>
  ${FT.map(([k,l])=>`<div class="f"><label><input type="checkbox" id="s_${k}" ${ft[k]&&ft[k].on?'checked':''}> ${l}</label>${k=='rules'?`<textarea id="f_${k}" rows="4">${esc(ft[k]&&ft[k].v)}</textarea>`:`<input id="f_${k}" value="${esc(ft[k]&&ft[k].v)}">`}</div>`).join('')}</div>
  <button class="p" id="sv">Enregistrer</button>`;
  $('#c_mode').value=G.mode;$('#c_logoPos').value=G.logoPos||'left';
  const lp=()=>$('#lgp').innerHTML=lg?`<img src="${lg}" alt="" style="width:64px;height:64px;border-radius:12px;object-fit:cover">`:'';lp();
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{const t=THEMES[b.dataset.th],s=document.documentElement.style;
    $('#c_accent').value=t[1];$('#c_bg1').value=t[2];$('#c_bg2').value=t[3];s.setProperty('--a',t[1]);s.setProperty('--b1',t[2]);s.setProperty('--b2',t[3])});
  $('#lgf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=120/Math.max(im.width,im.height,120),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);lg=c.toDataURL('image/png');lp()};im.src=URL.createObjectURL(f)};
  $('#lgx').onclick=()=>{lg='';lp()};
  $('#sv').onclick=async()=>{const c={};F.forEach(([k,,t])=>{let v=$('#c_'+k).value;if(t=='number')v=+v;if(k=='pin'&&!v)return;c[k]=v});
    c.logo=lg;c.logoPos=$('#c_logoPos').value;c.foot={};FT.forEach(([k])=>c.foot[k]={v:$('#f_'+k).value.trim(),on:$('#s_'+k).checked});
    try{await call({a:'save',cfg:c});if(c.pin){PIN=c.pin;sessionStorage.pin=PIN}toast('Réglages enregistrés')}catch(e){toast(e)}};
}
async function tSt(){
  $('#tab').innerHTML='<div class="box">Chargement…</div>';
  const {s}=await call({a:'stats'}),mx=Math.max(1,...s.series.map(x=>x[1]));
  const K=[['Clients',s.clients],['Nouveaux (30 jours)',s.new30],['Actifs (30 jours)',s.active30],['Tampons donnés',s.stamps],['Récompenses utilisées',s.used],['Récompenses en attente',s.pending]];
  $('#tab').innerHTML=`<div class="stg">${K.map(([l,v])=>`<div class="box"><div class="serif" style="font-size:34px">${v}</div><small>${l}</small></div>`).join('')}</div>
  <div class="box"><b>Tampons – 14 derniers jours</b><div class="bars">${s.series.map(([k,v])=>`<div title="${k} : ${v}"><span style="height:${v/mx*100}%"></span><small>${k.slice(3)}</small></div>`).join('')}</div></div>
  <div class="box"><b>Meilleurs clients</b>${s.top.map(c=>`<div class="li"><span>${esc(c.name)}</span><b>${c.stamps}</b></div>`).join('')||'<p>Aucun client.</p>'}</div>`;
}
function csv(n,rows){const t=rows.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=n;a.click()}
function footHTML(g){const f=g.foot||{},v=k=>f[k]&&f[k].on?String(f[k].v||'').trim():'';
  const u=(b,x)=>/^https?:\/\//i.test(x)?x:b+x.replace(/^@/,''),L=[],a=(h,t)=>`<a href="${esc(h)}" target="_blank" rel="noopener">${t}</a>`;
  if(v('link'))L.push(a(u('https://',v('link')),'Linktree'));if(v('fb'))L.push(a(u('https://facebook.com/',v('fb')),'Facebook'));if(v('ig'))L.push(a(u('https://instagram.com/',v('ig')),'Instagram'));
  if(v('tel'))L.push(a('tel:'+v('tel').replace(/[^\d+]/g,''),esc(v('tel'))));
  return `<div class="ft">${L.length?`<div class="lk">${L.join('')}</div>`:''}${v('addr')?`<p>${a('https://maps.google.com/?q='+encodeURIComponent(v('addr')),'📍 '+esc(v('addr')))}</p>`:''}${v('rules')?`<details><summary>Règlement</summary><p>${esc(v('rules'))}</p></details>`:''}</div>`}
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
addEventListener('unhandledrejection',e=>toast(String(e.reason)));
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent),inApp=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const insHTML=()=>inApp?'':`<div class="ft"><p>Installer la carte sur votre téléphone</p><div class="lk"><button id="ia" class="${isIOS?'':'p'}">🤖 Android</button><button id="ii" class="${isIOS?'p':''}">🍎 iPhone</button></div></div>`;
function sheet(t,steps){let m=$('#sh');if(!m){m=document.createElement('div');m.id='sh';document.body.appendChild(m)}
  m.innerHTML=`<div class="shb"><b class="serif" style="font-size:22px">${t}</b><ol>${steps.map(x=>`<li>${x}</li>`).join('')}</ol><button class="p" id="shx">OK</button></div>`;m.style.display='flex';$('#shx').onclick=()=>m.style.display='none'}
function insBind(){const a=$('#ia'),i=$('#ii');if(!a)return;
  a.onclick=()=>{if(dp){dp.prompt();dp=null}else sheet('Android',['Touchez le menu ⋮ en haut à droite de Chrome','Choisissez « Installer l\'application » (ou « Ajouter à l\'écran d\'accueil »)','Confirmez : l\'icône apparaît sur votre écran d\'accueil'])};
  i.onclick=()=>sheet('iPhone',['Ouvrez cette page dans Safari','Touchez le bouton Partager ⬆️ (en bas de l\'écran)','Choisissez « Sur l\'écran d\'accueil »','Touchez Ajouter, puis ouvrez la carte depuis l\'icône'])}
let bk='';
async function brand(g){
  const k=[g.shop,g.logo,g.icon,g.accent,g.bg1,g.bg2].join('|');if(k==bk)return;bk=k;
  document.title=g.shop;const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=g.bg1;
  const ic=(n,flat)=>new Promise(ok=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),end=()=>ok(c.toDataURL());
    if(!(flat&&g.logo)){const gr=x.createLinearGradient(0,0,n,n);gr.addColorStop(0,g.bg1);gr.addColorStop(1,g.bg2);x.fillStyle=gr;x.fillRect(0,0,n,n)}
    const txt=()=>{x.fillStyle=g.accent;x.font=`${n*.5}px serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(g.icon,n/2,n/2);end()};
    if(g.logo){const im=new Image();im.onload=()=>{const m=n*(flat?.94:.62),r=Math.min(m/im.width,m/im.height),w=im.width*r,h=im.height*r;x.drawImage(im,(n-w)/2,(n-h)/2,w,h);end()};im.onerror=txt;im.src=g.logo}else txt()});
  const set=(rel,href,type)=>{let l=document.querySelector(`link[rel="${rel}"]`);if(!l){l=document.createElement('link');l.rel=rel;document.head.appendChild(l)}l.href=href;if(type)l.type=type};
  const [f,a,i1,i2]=await Promise.all([ic(64,1),ic(180),ic(192),ic(512)]);
  set('icon',f,'image/png');set('apple-touch-icon',a);
  if(new URLSearchParams(location.search).has('c'))set('manifest',URL.createObjectURL(new Blob([JSON.stringify({name:g.shop,short_name:g.shop.slice(0,12),start_url:location.href,display:'standalone',background_color:g.bg1,theme_color:g.bg1,icons:[{src:i1,sizes:'192x192',type:'image/png'},{src:i2,sizes:'512x512',type:'image/png'}]})],{type:'application/manifest+json'})));
}
